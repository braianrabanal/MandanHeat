name: Release

# Al subir una etiqueta vX.Y.Z se compila el ejecutable único y se publica la Release.
# "Run workflow" (manual) solo compila y deja el zip como artefacto, sin publicar nada.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Versión
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Compilar ejecutable único
        shell: pwsh
        run: ./publicar.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: MandanHeat-win-x64
          path: release/MandanHeat-win-x64.zip

      - name: Publicar Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $changes = git log $range --no-merges --pretty=format:"- %s" | Where-Object { $_ -notmatch '^- Versión ' }
          $notes = (Get-Content docs/notas-release.md -Raw).Replace('{VERSION}', $env:VERSION)
          if ($changes) { $notes += "`n### Cambios`n" + ($changes -join "`n") + "`n" }
          Set-Content -Path notas.md -Value $notes -Encoding utf8
          gh release create $tag release/MandanHeat-win-x64.zip --title "MandanHeat $env:VERSION" --notes-file notas.md

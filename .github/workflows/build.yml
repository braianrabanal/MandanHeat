name: Build

# Comprueba que el proyecto compila en cada push y pull request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar
        run: dotnet build src/MandanHeat/MandanHeat.csproj -c Release
